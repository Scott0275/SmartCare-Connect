name: Deploy Lambdas - Staging (package + terraform plan)

on:
  workflow_dispatch: {}

jobs:
  package-and-plan:
    name: Package Lambdas and Terraform Plan (staging)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build lambda artifacts for staging
        run: npm run build:lambdas:staging

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Terraform init (staging)
        working-directory: terraform/envs/staging
        run: terraform init -input=false

      - name: Terraform plan (staging)
        working-directory: terraform/envs/staging
        env:
          # Provide these secrets through Actions Secrets in your repo / environment
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          terraform plan -input=false -out=tfplan

      - name: Upload plan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: terraform/envs/staging/tfplan
